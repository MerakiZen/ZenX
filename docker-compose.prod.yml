version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: zenx
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zenx}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenx"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    restart: always
    command: ["-js"]

  # Microservices
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/auth-service
    restart: always
    environment:
      DATABASE_URL: ${AUTH_DB_URL}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  workout-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/workout-service
    restart: always
    environment:
      DATABASE_URL: ${WORKOUT_DB_URL}
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  exercise-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/exercise-service
    restart: always
    environment:
      DATABASE_URL: ${EXERCISE_DB_URL}
    depends_on:
      postgres:
        condition: service_healthy

  profile-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/profile-service
    restart: always
    environment:
      DATABASE_URL: ${PROFILE_DB_URL}
    depends_on:
      postgres:
        condition: service_healthy

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/analytics-service
    restart: always
    environment:
      DATABASE_URL: ${ANALYTICS_DB_URL}
      WORKOUT_SERVICE_ADDR: workout-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      workout-service:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/notification-service
    restart: always
    environment:
      DATABASE_URL: ${NOTIFICATION_DB_URL}
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: cmd/gateway/Dockerfile
    restart: always
    environment:
      AUTH_ADDR: auth-service:8080
      WORKOUT_ADDR: workout-service:8081
      EXERCISE_ADDR: exercise-service:8083
      PROFILE_ADDR: profile-service:8084
      ANALYTICS_ADDR: analytics-service:8085
      NOTIFICATION_ADDR: notification-service:8086
    ports:
      - "4000:4000"
    depends_on:
      - auth-service
      - workout-service
      - exercise-service
      - profile-service
      - analytics-service
      - notification-service

volumes:
  pgdata:
