apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: zenx
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: zenx/gateway:latest
        ports:
        - containerPort: 4000
          name: http
        env:
        - name: GATEWAY_LISTEN
          value: ":4000"
        - name: AUTH_ADDR
          value: "auth-service:8080"
        - name: WORKOUT_ADDR
          value: "workout-service:8081"
        - name: EXERCISE_ADDR
          value: "exercise-service:8083"
        - name: PROFILE_ADDR
          value: "profile-service:8084"
        - name: ANALYTICS_ADDR
          value: "analytics-service:8085"
        - name: NOTIFICATION_ADDR
          value: "notification-service:8086"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: zenx
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 4000
    protocol: TCP
    name: http
  selector:
    app: gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: zenx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80


