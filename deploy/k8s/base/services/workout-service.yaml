apiVersion: apps/v1
kind: Deployment
metadata:
  name: workout-service
  namespace: zenx
  labels:
    app: workout-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: workout-service
  template:
    metadata:
      labels:
        app: workout-service
    spec:
      containers:
      - name: workout-service
        image: zenx/workout-service:latest
        ports:
        - containerPort: 8081
          name: grpc
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: workout-connection-string
        - name: NATS_URL
          valueFrom:
            configMapKeyRef:
              name: zenx-config
              key: nats-url
        - name: GRPC_PORT
          value: "8081"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command: ["/bin/grpc_health_probe", "-addr=:8081"]
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["/bin/grpc_health_probe", "-addr=:8081"]
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: workout-service
  namespace: zenx
spec:
  type: ClusterIP
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: grpc
  selector:
    app: workout-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: workout-service-hpa
  namespace: zenx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: workout-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80


