syntax = "proto3";

package zenx.notification.v1;

import "common/v1/common.proto";

option go_package = "github.com/zenx/backend/proto/notification/v1;notificationv1";

service NotificationService {
  rpc EnqueueNotification(EnqueueNotificationRequest) returns (EnqueueNotificationResponse);
  rpc UpdatePreference(UpdatePreferenceRequest) returns (Preference);
  rpc ListPreferences(ListPreferencesRequest) returns (ListPreferencesResponse);
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (Notification);
}

message EnqueueNotificationRequest {
  string user_id = 1;
  string template = 2;
  map<string, string> data = 3;
  int64 scheduled_for = 4;
}

message EnqueueNotificationResponse {
  string notification_id = 1;
}

message Preference {
  string user_id = 1;
  string channel = 2;
  bool enabled = 3;
}

message UpdatePreferenceRequest {
  Preference preference = 1;
}

message ListPreferencesRequest {
  string user_id = 1;
}

message ListPreferencesResponse {
  repeated Preference preferences = 1;
}

message Notification {
  string id = 1;
  string user_id = 2;
  string template = 3;
  map<string, string> data = 4;
  string status = 5;
  int64 created_at = 6;
  int64 scheduled_for = 7;
  int64 sent_at = 8;
}

message ListNotificationsRequest {
  string user_id = 1;
  common.v1.Pagination pagination = 2;
  string status = 3;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
  string next_cursor = 2;
}

message MarkNotificationReadRequest {
  string notification_id = 1;
  string user_id = 2;
}
